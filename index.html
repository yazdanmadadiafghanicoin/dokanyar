<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت دوکان‌یار</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f4;color:#18271f;font-family:Tahoma,Arial,sans-serif}
header{background:#102b20;color:white;padding:22px 16px}
header h1{margin:0 0 8px;font-size:23px}
header p{margin:0;color:#d1e2d7;font-size:13px}
main{max-width:900px;margin:auto;padding:16px}
.panel,.payment{background:white;border:1px solid #dce6df;border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 14px}
label{display:block;font-size:13px;margin-bottom:7px}
input{width:100%;padding:13px;border:1px solid #ccd9d0;border-radius:9px;margin-bottom:12px;font-size:15px}
button{padding:12px 15px;border:0;border-radius:9px;font-weight:bold;font-size:14px;cursor:pointer}
button:disabled{opacity:.5}
.primary{background:#147c4e;color:white}
.secondary{background:#e8efe9;color:#173c2b}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1}
.message{font-size:13px;line-height:1.8;margin-top:12px;overflow-wrap:anywhere}
.muted{font-size:12px;line-height:1.8;color:#68766e}
.details{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.detail{padding:10px;background:#f5f8f6;border-radius:8px;overflow-wrap:anywhere}
.detail small{display:block;color:#68766e;margin-bottom:6px}
.detail strong{font-size:13px}
.payment h3{margin:0 0 10px;font-size:17px}
.status{color:#9b6100;font-size:12px}
@media(max-width:480px){.details{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>مدیریت دوکان‌یار</h1>
<p>بررسی پرداخت‌ها و فعال‌سازی حساب مشتریان</p>
</header>

<main>
<section class="panel">
<h2>ورود مدیر</h2>
<label for="adminKey">کلید محرمانه مدیریت</label>
<input id="adminKey" type="password"
autocomplete="current-password"
placeholder="DOKANYAAR_ADMIN_KEY">
<div class="row">
<button class="primary" id="load">ورود و نمایش درخواست‌ها</button>
<button class="secondary" id="refresh">تازه‌سازی</button>
</div>
<div id="message" class="message" role="status"></div>
<p class="muted">کلید مدیریت را به مشتریان نده و در کد HTML ذخیره نکن.</p>
</section>

<h2>درخواست‌های پرداخت</h2>
<div id="payments">
<div class="panel muted">ابتدا وارد مدیریت شو.</div>
</div>
</main>

<script>
const API="/api";
const keyInput=document.getElementById("adminKey");
const message=document.getElementById("message");
const paymentsBox=document.getElementById("payments");
const loadButton=document.getElementById("load");
const refreshButton=document.getElementById("refresh");
let busy=false;

function say(text,error=false){
  message.textContent=text;
  message.style.color=error?"#b42318":"#176b43";
}
function safe(value){
  return String(value??"—").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}
async function request(path,method="GET",body=null){
  const key=keyInput.value.trim();
  if(!key)throw Error("کلید مدیریت را وارد کن.");
  const options={
    method,
    headers:{"x-admin-key":key,"Accept":"application/json"}
  };
  if(body!==null){
    options.headers["Content-Type"]="application/json";
    options.body=JSON.stringify(body);
  }
  const response=await fetch(API+path,options);
  const data=await response.json().catch(()=>({}));
  if(!response.ok||data.success===false){
    throw Error(data.error||data.message||("خطای سرور "+response.status));
  }
  return data;
}
function field(label,value){
  return `<div class="detail"><small>${safe(label)}</small><strong>${safe(value)}</strong></div>`;
}
function render(rows){
  paymentsBox.replaceChildren();
  if(!rows.length){
    const empty=document.createElement("div");
    empty.className="panel";
    empty.textContent="درخواست پرداخت در انتظار وجود ندارد.";
    paymentsBox.appendChild(empty);
    return;
  }

  rows.forEach(p=>{
    const card=document.createElement("article");
    card.className="payment";
    const date=p.created_at
      ?new Date(p.created_at).toLocaleString("fa-AF")
      :"—";

    card.innerHTML=`
      <h3>${safe(p.shop_name||"دوکان بدون نام")}</h3>
      <p class="status">وضعیت: در انتظار بررسی</p>
      <div class="details">
        ${field("شناسه پرداخت",p.payment_id)}
        ${field("شناسه دوکان",p.shop_id)}
        ${field("صاحب دوکان",p.owner_name)}
        ${field("نام کاربری",p.username)}
        ${field("مبلغ ثبت‌شده",Number(p.amount_afn||0)+" افغانی")}
        ${field("مرجع پرداخت",p.reference)}
        ${field("یادداشت",p.note)}
        ${field("تاریخ درخواست",date)}
      </div>
      <div class="row" style="margin-top:14px">
        <button class="primary approve">تأیید پرداخت و فعال‌سازی</button>
      </div>
      <p class="muted">پیش از تأیید، پرداخت واقعی را در حساب دریافت‌کننده بررسی کن.</p>
    `;

    card.querySelector(".approve").addEventListener("click",async e=>{
      if(!confirm(
        "آیا دریافت واقعی مبلغ را بررسی کرده‌ای؟\n"+
        "در صورت تأیید، اشتراک این دوکان فعال می‌شود."
      ))return;

      const button=e.currentTarget;
      button.disabled=true;
      try{
        const result=await request(
          "/admin/activate-subscription",
          "POST",
          {
            shop_id:Number(p.shop_id),
            payment_id:Number(p.payment_id),
            reference:p.reference||""
          }
        );
        alert(result.message||"عملیات انجام شد.");
        await loadPayments();
      }catch(err){
        alert(err.message||"فعال‌سازی انجام نشد.");
        button.disabled=false;
      }
    });
    paymentsBox.appendChild(card);
  });
}

async function loadPayments(){
  if(busy)return;
  busy=true;
  loadButton.disabled=true;
  refreshButton.disabled=true;
  say("در حال بارگذاری درخواست‌ها…");
  try{
    const data=await request("/admin/pending-payments");
    render(Array.isArray(data.payments)?data.payments:[]);
    say("اتصال موفق بود.");
  }catch(err){
    say(err.message||"خطا در دریافت درخواست‌ها.",true);
    paymentsBox.replaceChildren();
    const box=document.createElement("div");
    box.className="panel";
    box.textContent="درخواست‌ها دریافت نشدند. کلید مدیریت و انتشار API را بررسی کن.";
    paymentsBox.appendChild(box);
  }finally{
    busy=false;
    loadButton.disabled=false;
    refreshButton.disabled=false;
  }
}
loadButton.addEventListener("click",loadPayments);
refreshButton.addEventListener("click",loadPayments);
</script>
</body>
</html>
